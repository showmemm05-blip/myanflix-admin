services:
  admin:
    # Without this, a crash or host reboot leaves the service down until
    # someone notices and starts it by hand.
    restart: unless-stopped
    build:
      context: .
      args:
        # Baked into the browser bundle at build time — must be a URL the
        # end user's browser can actually reach (not a Docker-internal
        # hostname like "backend:3001"). Point this at the real API domain
        # once deployed.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api}
        # Defaults off — flip to true only once the direct-to-MinIO flow has
        # been validated (see the upload migration plan's rollout phase).
        NEXT_PUBLIC_USE_DIRECT_MINIO_UPLOAD: ${NEXT_PUBLIC_USE_DIRECT_MINIO_UPLOAD:-false}
        # Origin of the backend's MINIO_PUBLIC_ENDPOINT (e.g. http://localhost:8443),
        # baked into the Content-Security-Policy connect-src at build time so the
        # browser may PUT uploads there. Leave empty and connect-src stays open to
        # any http/https origin (uploads work, token exfiltration is not blocked).
        CSP_CONNECT_SRC_EXTRA: ${CSP_CONNECT_SRC_EXTRA:-}
    ports:
      - "${PORT:-3002}:3002"
    # Does the Next server answer? /login is public and renders without
    # calling the API, so this never depends on the backend. The image
    # (node:26-slim) has no curl/wget; Node's own fetch does the asking, and
    # any answer below 500 counts. A failing check marks the container
    # "unhealthy" in `docker compose ps`; Docker does not restart it for
    # that (../backend/DOCKER.md, "Health checks").
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/login').then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Keep at most 5 files of 50 MB of container log (same cap as the cache
    # server) instead of letting it grow until the disk fills.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
